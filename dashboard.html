<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Admin - Logistix Control</title>
</head>
<body class="flex h-screen bg-slate-900 overflow-hidden font-sans">

    <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col shadow-2xl z-10">
        <div class="p-6 bg-slate-800 border-b border-slate-700">
            <h1 class="text-white text-xl font-black italic tracking-tighter">LOGISTIX <span class="text-red-500">PRO</span></h1>
        </div>

        <div class="p-4 overflow-y-auto space-y-3" id="truck-list">
            <h3 class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Flotte Active</h3>
            <div class="bg-slate-800 p-3 rounded-lg border-l-4 border-green-500 text-white flex justify-between items-center">
                <span>Camion 05</span>
                <span class="text-[10px] bg-green-500/20 text-green-500 px-2 py-1 rounded">EN ROUTE</span>
            </div>
        </div>
    </aside>

    <main class="flex-1 relative">
        <div id="map" class="h-full w-full"></div>
        <div class="absolute top-4 right-4 z-[1000] bg-white p-4 rounded-xl shadow-2xl border-b-4 border-slate-300">
            <p class="text-xs text-gray-500 font-bold uppercase tracking-tighter">Camions en mouvement</p>
            <p class="text-2xl font-black text-slate-800" id="count">0</p>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxCvdO2FF8EN3mK1nHcj_7M3kz5ejpv1q2IwqijZ9ScPxXF8pF3RQ01vX50-3yxIWdR/exec";
        const map = L.map('map').setView([4.0511, 9.7679], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const markers = {};

        async function updateMap() {
            try {
                const res = await fetch(API_URL + "?get=positions");
                const data = await res.json();
                document.getElementById('count').innerText = data.length;
                
                data.forEach(row => {
                    const [date, id, lat, lng, status] = row;
                    if (markers[id]) {
                        markers[id].setLatLng([lat, lng]);
                    } else {
                        markers[id] = L.marker([lat, lng]).addTo(map).bindPopup("<b>Camion " + id + "</b><br>Dernière position : " + new Date(date).toLocaleTimeString());
                    }
                });
            } catch (e) { console.error("Erreur sync", e); }
        }

        setInterval(updateMap, 15000);
        updateMap();
    </script>
</body>
</html>
